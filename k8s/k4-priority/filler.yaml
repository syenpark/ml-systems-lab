# Size so that 2 × filler ≈ 90% of free node CPU.
# free = node allocatable − already requested (kubectl describe node).
# My kind node: 6 allocatable − 1.15 requested = 4.85 free → 2 × 2200m = 4.4
apiVersion: v1
kind: Namespace
metadata:
  name: k4-prio          # no ResourceQuota, no LimitRange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filler
  namespace: k4-prio
  labels: {app: filler}
spec:
  replicas: 2
  selector:
    matchLabels: {app: filler}
  template:
    metadata:
      labels: {app: filler}
    spec:
      priorityClassName: low
      containers:
      - name: pause
        image: registry.k8s.io/pause:3.9
        resources:
          requests: {cpu: 2200m}
